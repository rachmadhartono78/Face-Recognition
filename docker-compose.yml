version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: face_recognition_db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: face_recognition
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - face_recognition_network

  # Python Face Recognition API
  python-api:
    build:
      context: ./face_recognition_api
    container_name: face_recognition_api
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: face_recognition
      DB_USER: user
      DB_PASSWORD: password
    ports:
      - "5000:5000"
    volumes:
      - ./face_recognition_api:/app
    depends_on:
      - mysql
    networks:
      - face_recognition_network
    devices:
      - /dev/video0:/dev/video0
    restart: unless-stopped

  # Laravel Application
  laravel:
    build:
      context: .
    container_name: face_recognition_laravel
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: face_recognition
      DB_USERNAME: user
      DB_PASSWORD: password
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
      - python-api
    networks:
      - face_recognition_network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: face_recognition_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - laravel
      - python-api
    networks:
      - face_recognition_network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  face_recognition_network:
    driver: bridge